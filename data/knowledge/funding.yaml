programmes:
  - id: kfw-444-nkk
    name: "Natürlicher Klimaschutz in Kommunen (NKK), KfW-Zuschuss 444"
    funder: "BMUKN, abgewickelt durch die KfW"
    level: Bund
    region: DE
    applicants: [kommune, oeffentlich]
    applicant_note: "Kommunale Gebietskörperschaften, Gemeindeverbände, Eigenbetriebe, Zweckverbände; weitere nicht Bund/Land zugeordnete Körperschaften des öffentlichen Rechts (z. B. Kirchen). Keine wirtschaftliche Tätigkeit im Sinne des EU-Beihilferechts."
    measures:
      entsiegelung: "Förderbereich D (Entsiegelung: D.1 Konzepte, D.2 Umsetzung)"
      baeume: "Förderbereich B (Pflanzung von Bäumen inkl. Standortoptimierung und Entwicklungspflege)"
      mulde: null   # no own module for rainwater retention; C.5 only covers small inner-city waters
      gruendach: null
    rate: 0.5
    rate_reduced_budget: 0.8
    rate_note: "50 % der förderfähigen Kosten; 80 % für finanzschwache Kommunen mit nachgewiesener Haushaltsnotlage nach Landesrecht."
    min_grant_eur: 15000
    caps:
      entsiegelung: {max_total_cost_eur: 1000000, note: "D.2: förderfähige Gesamtkosten höchstens 1 Mio. €; Richtwert 60 €/m², bis 1.000 m² max. 200 €/m², ab 1.000 m² max. 100 €/m²."}
    window: {type: laufend, opens: null, closes: null, note: "Antrag jederzeit bei der KfW; Zusage muss vor Vorhabenbeginn vorliegen."}
    before_start: true
    duration_note: "Förderzeitraum 24 Monate ab Zusage (einmal um bis zu 24 Monate verlängerbar); Verwendungsnachweis innerhalb von 6 Monaten."
    binding_note: "Zweckbindung für Pflanzungen, Entsiegelung und Naturoasen bis mindestens 2045."
    source: "https://www.kfw.de/PDF/Download-Center/F%C3%B6rderprogramme-(Inlandsf%C3%B6rderung)/PDF-Dokumente/6000005070_M_444.pdf"
    source_label: "KfW Merkblatt Zuschuss Nr. 444, Stand 02/2026"
    checked: 2026-10-17

